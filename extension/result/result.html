<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../icons/icon48.png">
  <title>Enhanced Prompt</title>
  <link rel="stylesheet" href="result.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>✨ Prompt Optimizer</h1>
    </header>

    <main>
      <label for="rawInput">Raw Prompt</label>
      <textarea id="rawInput" placeholder="Edit your raw prompt here..."></textarea>

      <button id="reEnhanceBtn">✨ Re-Enhance</button>
      <div id="loading">Enhancing...</div>

      <label for="promptDisplay">Structured Prompt</label>
      <textarea id="promptDisplay" readonly></textarea>

      <button id="copyBtn">Copy to Clipboard</button>
      <span id="copyStatus"></span>
    </main>
  </div>
  <script src="result.js"></script>
</body>
</html>
